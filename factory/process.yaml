      - "src/main/java/io/orkes/example/saga/pojos/Driver*.java"
      - src/main/java/io/orkes/example/saga/pojos/CancelRequest.java
      - src/test/java/io/orkes/example/saga/dao/ShipmentDAOTest.java
    build_unit: ./gradlew test --no-daemon
    spec: docs/architecture.md
    readiness: R1
    readiness_evidence: "https://github.com/tradingbot-tw/saga-pattern/actions/runs/37170942352"
    owner: tradingbot-tw
  - id: workflow
