      - src/test/java/io/orkes/example/saga/service/PaymentServiceTest.java
      - src/test/java/io/orkes/example/saga/dao/PaymentsDAOTest.java
    build_unit: ./gradlew test --no-daemon
    spec: docs/architecture.md
    readiness: R1
    readiness_evidence: "https://github.com/tradingbot-tw/saga-pattern/actions/runs/37170942352"
    owner: tradingbot-tw
  - id: shipment
